name: Saturday UFC Odds & Auto Predictions Update

on:
  schedule:
    - cron: '0 0 * * 6' # 매주 토요일 UTC 00:00 (한국 시간 오전 9시)
  workflow_dispatch:

concurrency:
  group: ufc-pipeline
  cancel-in-progress: false

jobs:
  auto-predictions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
      AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
      DIFY_API_KEY: ${{ secrets.DIFY_API_KEY }}

    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 세팅
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 환경 점검
        run: |
          python --version
          echo "[INFO] Saturday auto-predictions pipeline starting"

      - name: 자동 배당 수집 + 퀀트 예측 + Airtable 저장
        run: python auto_predictions.py
