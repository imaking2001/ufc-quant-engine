name: Sunday UFC Result Settlement

on:
  schedule:
    - cron: '0 8 * * 0'
  workflow_dispatch:
    inputs:
      start_date:
        description: '백필 시작일 (예: 2026-03-14)'
        required: false
        default: ''
      end_date:
        description: '백필 종료일 (예: 2026-03-21)'
        required: false
        default: ''

jobs:
  settle-results:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 세팅
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 일요일 ROI 정산 봇 실행
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          DIFY_API_KEY: ${{ secrets.DIFY_API_KEY }}
          BACKFILL_START_DATE: ${{ github.event.inputs.start_date }}
          BACKFILL_END_DATE: ${{ github.event.inputs.end_date }}
        run: |
          python Result_Updater.py
