name: Wednesday UFC Data Full Update

on:
  schedule:
    - cron: '0 0 * * 3' # 매주 수요일 UTC 00:00 (한국 시간 오전 9시)
  workflow_dispatch:

concurrency:
  group: ufc-pipeline
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
      AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
      DIFY_API_KEY: ${{ secrets.DIFY_API_KEY }}

    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 세팅
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 환경 점검
        run: |
          python --version
          echo "[INFO] Wednesday pipeline starting"

      - name: 1단계 - 유망주/누락 파이터 보강
        run: python Prospect_Crawler.py

      - name: 2단계 - 상세 전적/True Stat 갱신
        run: python Match_History.py

      - name: 3단계 - 최종 파이프라인 및 Z-Score 재계산
        run: python main.py
